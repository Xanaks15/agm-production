user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Resolver DNS dinámico de Railway (DNS interno)
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 80;
        server_name localhost api-agm.up.railway.app;

        # Configuración centralizada de CORS
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # ==========================================
        # MS-1: Auth
        # ==========================================
        location = /api/auth/health {
            set $ms_auth agm-production.railway.internal;
            proxy_pass http://$ms_auth:8001/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/auth/ {
            set $ms_auth agm-production.railway.internal;
            proxy_pass http://$ms_auth:8001/auth/;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ==========================================
        # MS-2: Periodos y Materias
        # ==========================================
        location /api/periodos/ {
            set $ms_periodos agm-periodos-materias.railway.internal;
            proxy_pass http://$ms_periodos:8002/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ==========================================
        # MS-3: Docentes y Alumnos
        # ==========================================
        location = /api/alumnos/health {
            set $ms_docentes agm-docentes-alumnos.railway.internal;
            proxy_pass http://$ms_docentes:8003/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/alumnos/ {
            set $ms_docentes agm-docentes-alumnos.railway.internal;
            proxy_pass http://$ms_docentes:8003/api/v1/;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ==========================================
        # MS-4: Calificaciones
        # ==========================================
        location /api/calificaciones/ {
            set $ms_calificaciones ms-calificaciones.railway.internal;
            proxy_pass http://$ms_calificaciones:8004/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ==========================================
        # MS-5: Asistencias
        # ==========================================
        location /api/asistencias/ {
            set $ms_asistencias ms-asistencias.railway.internal;
            proxy_pass http://$ms_asistencias:8005/;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ==========================================
        # MS-6: Notificaciones
        # Nota: RAILWAY_PRIVATE_DOMAIN de este servicio está mal asignado
        # (apunta a ms-periodos-materias). Usamos su URL pública.
        # ==========================================
        location = /api/notificaciones/health {
            set $ms_notificaciones ms-notificaciones-production.up.railway.app;
            proxy_pass https://$ms_notificaciones/health;
            proxy_ssl_server_name on;
            proxy_set_header Host $ms_notificaciones;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/notificaciones/ {
            set $ms_notificaciones ms-notificaciones-production.up.railway.app;
            proxy_pass https://$ms_notificaciones/api/v1/notificaciones/;
            proxy_ssl_server_name on;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $ms_notificaciones;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ==========================================
        # MS-7: Reportes
        # ==========================================
        location = /api/reportes/health {
            set $ms_reportes ms-reportes.railway.internal;
            proxy_pass http://$ms_reportes:8007/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/reportes/ {
            set $ms_reportes ms-reportes.railway.internal;
            proxy_pass http://$ms_reportes:8007/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
